    function setAdminCloudStatus(connected, labelText) {

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function extractGoogleDriveFileId(url) {
      if (!url) return '';
      const trimmed = String(url).trim();
      const driveMatch = trimmed.match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=view&)?id=|thumbnail\?id=)|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]{15,})/);
      return driveMatch && driveMatch[1] ? driveMatch[1] : '';
    }

    function normalizeGoogleDriveImageUrl(url) {
      if (!url) return '';
      const trimmed = String(url).trim();
      if (trimmed.startsWith('data:image/')) return trimmed;
      const fileId = extractGoogleDriveFileId(trimmed);
      if (fileId) {
        return `https://lh3.googleusercontent.com/d/${fileId}`;
      }
      return trimmed;
    }

    function sanitizeUrl(url) {
      if (!url) return '#';
      const trimmed = normalizeGoogleDriveImageUrl(url);
      if (/^(https?:\/\/|data:image\/|mailto:|tel:|#)/i.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    function applyImageWithDriveFallback(imgEl, rawUrl, placeholderEl = null) {
      if (!imgEl) return;
      const cleanUrl = sanitizeUrl(rawUrl);
      const driveId = extractGoogleDriveFileId(rawUrl);
      imgEl.dataset.fallbackStage = '0';
      imgEl.onerror = function() {
        const stage = Number(this.dataset.fallbackStage || '0');
        if (driveId && stage === 0) {
          this.dataset.fallbackStage = '1';
          this.src = `https://drive.google.com/thumbnail?id=${driveId}&sz=w1600`;
        } else if (driveId && stage === 1) {
          this.dataset.fallbackStage = '2';
          this.src = `https://drive.google.com/uc?export=view&id=${driveId}`;
        } else {
          this.classList.add('hidden');
          if (placeholderEl) placeholderEl.classList.remove('hidden');
        }
      };
      imgEl.src = cleanUrl;
      imgEl.classList.remove('hidden');
      if (placeholderEl) placeholderEl.classList.add('hidden');
    }

    function formatDateIndo(startStr, endStr) {
      if (!startStr) return '-';
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const parsePart = (s) => {
        const p = s.split('-');
        if (p.length !== 3) return s;
        return `${parseInt(p[2], 10)} ${months[parseInt(p[1], 10) - 1] || p[1]} ${p[0]}`;
      };
      if (!endStr || startStr === endStr) return parsePart(startStr);
      return `${parsePart(startStr)} s.d. ${parsePart(endStr)}`;
    }

    function isLmsEligibleCategory(category) {
      const cat = String(category || '').toLowerCase();
      return ['pelatihan', 'bimtek', 'workshop'].includes(cat);
    }

    function isCertificateReleased(ev) {
      if (!ev) return false;
      const mode = ev.certReleaseMode || 'auto';
      if (mode === 'open') return true;
      if (mode === 'locked') return false;
      if (ev.certReleaseDatetime) {
        const t = new Date(ev.certReleaseDatetime).getTime();
        if (!isNaN(t)) return Date.now() >= t;
      }
      return ev.status === 'Selesai';
    }

    function normalizeEventItem(ev) {
      const cert = ev.certificate || {};
      return {
        ...ev,
        flyerImg: normalizeGoogleDriveImageUrl(ev.flyerImg || ''),
        speakers: Array.isArray(ev.speakers) ? ev.speakers : [],
        materials: Array.isArray(ev.materials) ? ev.materials : [],
        recordings: Array.isArray(ev.recordings) ? ev.recordings : [],
        lmsModules: Array.isArray(ev.lmsModules) ? ev.lmsModules : [],
        attendees: Array.isArray(ev.attendees) ? ev.attendees : [],
        certificate: {
          prefix: cert.prefix || 'SERT-JSIT-LPG/2026',
          jp: cert.jp || '8 JP',
          issuedPlace: cert.issuedPlace || 'Bandar Lampung',
          issuedDateText: cert.issuedDateText || formatDateIndo(ev.dateEnd || ev.dateStart),
          signerName: cert.signerName || settingsData.signerName || DEFAULT_SETTINGS.signerName,
          signerTitle: cert.signerTitle || settingsData.signerTitle || DEFAULT_SETTINGS.signerTitle,
          templateBg: normalizeGoogleDriveImageUrl(cert.templateBg || ''),
          layout: { ...DEFAULT_LAYOUT, ...(cert.layout || {}) }
        }
      };
    }

    function loadLocalFallback() {
      try {
        const rawSet = localStorage.getItem(STORAGE_KEY_SETTINGS);
        settingsData = rawSet ? { ...DEFAULT_SETTINGS, ...JSON.parse(rawSet) } : { ...DEFAULT_SETTINGS };
      } catch (e) {
        settingsData = { ...DEFAULT_SETTINGS };
      }
      try {
        const rawEv = localStorage.getItem(STORAGE_KEY_EVENTS);
        if (rawEv) {
          const parsed = JSON.parse(rawEv);
          if (Array.isArray(parsed) && parsed.length > 0) {
            eventsData = parsed.map(normalizeEventItem);
            return;
          }
        }
      } catch (e) {}
      eventsData = SEED_EVENTS.map(normalizeEventItem);
      saveLocalCache();
    }

    function saveLocalCache() {
      try {
        localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(eventsData));
        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settingsData));
      } catch (e) {}
    }

    function getStoredUsers() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_USERS);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveStoredUsers(list) {
      try {
        localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(list));
      } catch (e) {}
    }

    /* ===================================================================== */
    /* PEMASTIAN SESI FIREBASE AUTH (AGAR FIRESTORE WRITE DIIZINKAN)         */
    /* ===================================================================== */
    async function ensureFirebaseAuthSession() {
      if (typeof firebase === 'undefined' || !firebase.auth) return false;
      try {
        if (firebase.auth().currentUser) return true;
        await firebase.auth().signInAnonymously();
        return true;
      } catch (err) {
        return false;
      }
    }

    function formatCloudErrorMessage(err) {
      const msg = (err && err.message) ? err.message : String(err);
      if (/permission|insufficient/i.test(msg)) {
        return 'Izin penulisan Cloud ditolak oleh aturan Firestore Rules.\n\nSolusi: Buka Firebase Console > Firestore Database > Rules, pastikan izin write aktif (allow read, write: if true; atau aktifkan Anonymous Sign-in di Authentication).';
      }
      return msg;
    }

    /* ===================================================================== */
    /* OTENTIKASI & KONTROL HAK AKSES AKUN UTAMA                             */
    /* ===================================================================== */
    function isSuperAdmin() {
      return currentAdminAccount && currentAdminAccount.role === 'superadmin';
    }

    function hasPermission(permKey) {
      if (!currentAdminAccount) return false;
      if (isSuperAdmin()) return true;
      const perms = currentAdminAccount.permissions || {};
      return Boolean(perms[permKey]);
    }

    function applyRolePermissionsUI() {
      if (!currentAdminAccount) return;

      const superMode = isSuperAdmin();
      const rolePill = document.getElementById('admin-role-pill');
      const userSub = document.getElementById('admin-user-subtitle');

      if (rolePill) {
        rolePill.textContent = superMode ? 'Akun Utama' : 'Admin / Panitia';
        rolePill.className = superMode
          ? 'px-2 py-0.5 rounded bg-amber-400/20 border border-amber-300/40 text-amber-200 text-[10px] font-bold uppercase'
          : 'px-2 py-0.5 rounded bg-sky-400/20 border border-sky-300/40 text-sky-200 text-[10px] font-bold uppercase';
      }
      if (userSub) {
        userSub.textContent = `${currentAdminAccount.fullName || currentAdminAccount.username} • JSIT Wilayah Lampung`;
      }

      const tabKeys = ['events', 'attendees', 'lms', 'resources', 'certificate', 'settings'];
      let firstAllowedTab = null;

      tabKeys.forEach(key => {
        const btn = document.getElementById(`admtab-${key}`);
        const allowed = hasPermission(key);
        if (btn) {
          btn.classList.toggle('hidden', !allowed);
        }
        if (allowed && !firstAllowedTab) {
          firstAllowedTab = key;
        }
      });

      const canManageEvents = hasPermission('events');
      const btnCreate = document.getElementById('btn-create-event-top');
      const btnDelete = document.getElementById('btn-delete-event-top');
      if (btnCreate) btnCreate.classList.toggle('hidden', !canManageEvents);
      if (btnDelete) btnDelete.classList.toggle('hidden', !superMode);

      const createStaffBox = document.getElementById('superadmin-create-box');
      if (createStaffBox) {
        createStaffBox.classList.toggle('hidden', !superMode);
      }

      if (firstAllowedTab) {
        switchAdminTab(firstAllowedTab);
      }
    }

    function showLoginError(msg) {
      const box = document.getElementById('login-error-box');
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const loginId = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';
      document.getElementById('login-error-box').classList.add('hidden');

      try {
        if ((loginId.toLowerCase() === 'admin' || loginId.toLowerCase() === 'admin@jsitlampung.or.id') && pass === 'jsitlampung2026') {
          await ensureFirebaseAuthSession();
          const masterAccount = {
            id: 'superadmin-master',
            username: 'admin',
            fullName: 'Akun Utama (Super Admin)',
            school: 'JSIT Wilayah Lampung',
            role: 'superadmin',
            permissions: { events: true, attendees: true, lms: true, resources: true, certificate: true, settings: true }
          };
          grantAdminSession(masterAccount);
          return;
        }

        if (typeof firebase !== 'undefined' && firebase.auth && loginId.includes('@')) {
          try {
            const cred = await firebase.auth().signInWithEmailAndPassword(loginId, pass);
            const fbAdmin = {
              id: cred.user.uid,
              username: loginId,
              fullName: cred.user.displayName || loginId.split('@')[0],
              school: 'JSIT Wilayah Lampung',
              role: 'superadmin',
              permissions: { events: true, attendees: true, lms: true, resources: true, certificate: true, settings: true }
            };
            grantAdminSession(fbAdmin);
            return;
          } catch (fbErr) {}
        }

        await ensureFirebaseAuthSession();

        let matchedStaff = null;
        if (isFirebaseReady && db) {
          try {
            const snap = await db.collection('users').get();
            snap.forEach(doc => {
              const u = { id: doc.id, ...doc.data() };
              if ((u.username || '').toLowerCase() === loginId.toLowerCase() && u.password === pass) {
                matchedStaff = u;
              }
            });
          } catch (err) {}
        }

        if (!matchedStaff) {
          const localUsers = getStoredUsers();
          matchedStaff = localUsers.find(u =>
            (u.username || '').toLowerCase() === loginId.toLowerCase() && u.password === pass
          );
        }

        if (!matchedStaff) {
          throw new Error('Username atau Password tidak valid.');
        }

        if (matchedStaff.role !== 'superadmin' && matchedStaff.role !== 'admin' && matchedStaff.role !== 'panitia') {
          throw new Error('Akun Anda terdaftar sebagai Peserta dan belum diberikan hak akses Admin oleh Akun Utama.');
        }

        const { password, ...safeStaff } = matchedStaff;
        grantAdminSession(safeStaff);
      } catch (err) {
        showLoginError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk ke Dashboard Admin';
      }
    }

    function grantAdminSession(accountObj) {
      currentAdminAccount = accountObj;
      try {
        sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
        const serialized = JSON.stringify(accountObj);
        sessionStorage.setItem(SESSION_KEY_CURRENT_USER, serialized);
        localStorage.setItem(SESSION_KEY_CURRENT_USER, serialized);
      } catch (e) {}

      document.getElementById('admin-login-screen').classList.add('hidden');
      document.getElementById('admin-workspace').classList.remove('hidden');
      applyRolePermissionsUI();
      initAdminDataAndCloud();
    }

    async function handleAdminLogout() {
      try {
        sessionStorage.removeItem(ADMIN_SESSION_KEY);
        sessionStorage.removeItem(SESSION_KEY_CURRENT_USER);
        localStorage.removeItem(SESSION_KEY_CURRENT_USER);
        if (typeof firebase !== 'undefined' && firebase.auth) {
          await firebase.auth().signOut();
        }
      } catch (e) {}
      currentAdminAccount = null;
      document.getElementById('admin-workspace').classList.add('hidden');
      document.getElementById('admin-login-screen').classList.remove('hidden');
    }

    /* ===================================================================== */
    /* INISIALISASI FIREBASE & CLOUD SYNC                                    */
    /* ===================================================================== */
    function initFirebaseCore() {
      if (typeof firebase === 'undefined' || typeof window.FIREBASE_CONFIG === 'undefined') {
        setAdminCloudStatus(false, 'Mode Lokal');
        return;
      }
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(window.FIREBASE_CONFIG);
        }
        db = firebase.firestore();
        isFirebaseReady = true;
        setAdminCloudStatus(true, 'Cloud JSIT Aktif');
      } catch (err) {
        setAdminCloudStatus(false, 'Mode Lokal');
      }
    }

    async function initAdminDataAndCloud() {
      loadLocalFallback();

      if (isFirebaseReady && db) {
        await ensureFirebaseAuthSession();

        db.collection('settings').doc('global').onSnapshot((doc) => {
          if (doc.exists) {
            settingsData = { ...DEFAULT_SETTINGS, ...doc.data() };
            saveLocalCache();
          }
          populateSettingsForm();
        }, () => {});

        db.collection('events').onSnapshot((snapshot) => {
          const prevMap = new Map(eventsData.map(e => [e.id, e.attendees || []]));
          const list = [];
          snapshot.forEach(doc => {
            const norm = normalizeEventItem({ id: doc.id, ...doc.data() });
            if ((!norm.attendees || norm.attendees.length === 0) && prevMap.has(doc.id)) {
              norm.attendees = prevMap.get(doc.id);
            }
            list.push(norm);
          });

          if (list.length > 0) {
            list.sort((a, b) => (b.dateStart || '').localeCompare(a.dateStart || ''));
            eventsData = list;
            saveLocalCache();
          } else {
            eventsData.forEach(ev => {
              const { attendees, ...metaOnly } = ev;
              db.collection('events').doc(ev.id).set(metaOnly, { merge: true }).catch(() => {});
            });
          }
          refreshAdminWorkspace();
        }, () => {
          refreshAdminWorkspace();
        });

        loadRegisteredUsers();
      } else {
        populateSettingsForm();
        refreshAdminWorkspace();
        loadRegisteredUsers();
      }

      if (window.lucide) lucide.createIcons();
    }

    /* ===================================================================== */
    /* MANAJEMEN AKUN & HAK AKSES OLEH AKUN UTAMA                            */
    /* ===================================================================== */
    function loadRegisteredUsers() {
      const localList = getStoredUsers();
      registeredUsersData = [...localList];
      renderRegisteredUsersList();

      if (isFirebaseReady && db) {
        if (usersUnsubscribe) usersUnsubscribe();
        usersUnsubscribe = db.collection('users').onSnapshot((snap) => {
          const mergedMap = new Map();
          getStoredUsers().forEach(u => mergedMap.set(u.id, u));
          snap.forEach(doc => {
            mergedMap.set(doc.id, { id: doc.id, ...doc.data() });
          });
          registeredUsersData = Array.from(mergedMap.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          saveStoredUsers(registeredUsersData);
          renderRegisteredUsersList();
        }, () => {});
      }
    }

    async function createStaffAccountBySuperAdmin(e) {
      e.preventDefault();
      if (!isSuperAdmin()) {
        alert('Hanya Akun Utama yang berhak mendaftarkan akun Admin / Panitia baru.');
        return;
      }

      const fullName = document.getElementById('new-staff-name').value.trim();
      const school = document.getElementById('new-staff-school').value.trim();
      const username = document.getElementById('new-staff-username').value.trim();
      const password = document.getElementById('new-staff-password').value;

      if (registeredUsersData.some(u => (u.username || '').toLowerCase() === username.toLowerCase())) {
        alert('Username/Email tersebut sudah terdaftar. Gunakan username lain.');
        return;
      }

      const permissions = {
        events: document.getElementById('perm-new-events').checked,
        attendees: document.getElementById('perm-new-attendees').checked,
        lms: document.getElementById('perm-new-lms').checked,
        resources: document.getElementById('perm-new-resources').checked,
        certificate: document.getElementById('perm-new-certificate').checked,
        settings: document.getElementById('perm-new-settings').checked
      };

      const userId = 'adm-' + Date.now();
      const newStaff = {
        id: userId,
        fullName,
        school,
        region: 'JSIT Wilayah Lampung',
        phone: '-',
        username,
        password,
        role: 'admin',
        permissions,
        createdAt: Date.now()
      };

      registeredUsersData.unshift(newStaff);
      saveStoredUsers(registeredUsersData);
      renderRegisteredUsersList();

      if (isFirebaseReady && db) {
        try {
          await ensureFirebaseAuthSession();
          await db.collection('users').doc(userId).set(newStaff);
        } catch (err) {
          alert('Akun tersimpan lokal, namun gagal sinkron ke Cloud:\n' + formatCloudErrorMessage(err));
          return;
        }
      }

      e.target.reset();
      document.getElementById('perm-new-events').checked = true;
      document.getElementById('perm-new-attendees').checked = true;
      document.getElementById('perm-new-lms').checked = true;
      document.getElementById('perm-new-resources').checked = true;
      document.getElementById('perm-new-certificate').checked = true;
      alert(`Akun Admin "${fullName}" berhasil dibuat dan diaktifkan.`);
    }

    function renderRegisteredUsersList() {
      const container = document.getElementById('registered-users-list');
      const countBadge = document.getElementById('users-count-badge');
      if (!container) return;

      if (countBadge) countBadge.textContent = `${registeredUsersData.length} Akun`;

      if (registeredUsersData.length === 0) {

    async function toggleUserRole(userId, newRole) {
      if (!isSuperAdmin()) return;
      const user = registeredUsersData.find(u => u.id === userId);
      if (!user) return;

      user.role = newRole;
      if (newRole === 'admin') {
        user.permissions = {
          events: true,
          attendees: true,
          lms: true,
          resources: true,
          certificate: true,
          settings: false
        };
      } else {
        user.permissions = {
          events: false,
          attendees: false,
          lms: false,
          resources: false,
          certificate: false,
          settings: false
        };
      }

      saveStoredUsers(registeredUsersData);
      renderRegisteredUsersList();

      if (isFirebaseReady && db) {
        try {
          await ensureFirebaseAuthSession();
          await db.collection('users').doc(userId).set({
            role: user.role,
            permissions: user.permissions
          }, { merge: true });
        } catch (err) {
          alert('Gagal menyimpan perubahan hak akses ke Cloud:\n' + formatCloudErrorMessage(err));
        }
      }
    }

    async function toggleUserPermission(userId, permKey, isAllowed) {
      if (!isSuperAdmin()) return;
      const user = registeredUsersData.find(u => u.id === userId);
      if (!user) return;

      user.permissions = { ...(user.permissions || {}), [permKey]: isAllowed };
      saveStoredUsers(registeredUsersData);

      if (isFirebaseReady && db) {
        try {
          await ensureFirebaseAuthSession();
          await db.collection('users').doc(userId).set({
            permissions: user.permissions
          }, { merge: true });
        } catch (err) {
          alert('Gagal menyimpan hak akses ke Cloud:\n' + formatCloudErrorMessage(err));
        }
      }
    }

    async function deleteRegisteredUser(userId) {
      if (!isSuperAdmin()) return;
      const user = registeredUsersData.find(u => u.id === userId);
      if (!user) return;
      if (!confirm(`Hapus akun "${user.fullName}" (${user.username}) secara permanen?`)) return;

      registeredUsersData = registeredUsersData.filter(u => u.id !== userId);
      saveStoredUsers(registeredUsersData);
      renderRegisteredUsersList();

      if (isFirebaseReady && db) {
        try {
          await ensureFirebaseAuthSession();
          await db.collection('users').doc(userId).delete();
        } catch (err) {}
      }
    }

    function subscribeSelectedEventAttendees(eventId) {
      if (attendeesUnsubscribe) {
        attendeesUnsubscribe();
        attendeesUnsubscribe = null;
      }
      if (!isFirebaseReady || !db || !eventId) return;

      attendeesUnsubscribe = db.collection('events').doc(eventId).collection('attendees')
        .onSnapshot((snap) => {
          const list = [];
          snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

          const ev = eventsData.find(item => item.id === eventId);
          if (ev) {
            ev.attendees = list;
            saveLocalCache();
            renderKPIs();
            populateAttendeesTable(ev);
            populateLmsAdminPanel(ev);
          }
        }, () => {});
    }

    function handleFlyerUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 800;
          const scale = img.width > maxW ? (maxW / img.width) : 1;
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          uploadedFlyerDataUrl = canvas.toDataURL('image/jpeg', 0.78);
          document.getElementById('edit-ev-flyer-url').value = '';
          updateAdminFlyerPreview(uploadedFlyerDataUrl);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function persistEventMetaToCloud(ev) {
      saveLocalCache();
      if (isFirebaseReady && db && ev) {
        await ensureFirebaseAuthSession();
        const { attendees, ...metaPayload } = ev;
        const jsonSize = new Blob([JSON.stringify(metaPayload)]).size;
        if (jsonSize > 950000) {
          throw new Error('Ukuran gambar template/flyer terlalu besar (> 950 KB). Gunakan file gambar yang lebih ringan atau masukkan tautan Google Drive.');
        }
        await db.collection('events').doc(ev.id).set(metaPayload, { merge: true });
      }
    }

    async function submitManualAttendee(e) {
      e.preventDefault();
      const ev = eventsData.find(item => item.id === selectedEventId);
      if (!ev) return;

      const now = new Date();
      const timestamp = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' +
        now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';

      const newId = 'att-man-' + Date.now();
      const record = {
        id: newId,
        name: document.getElementById('man-att-name').value.trim(),
        school: document.getElementById('man-att-school').value.trim(),
        region: document.getElementById('man-att-region').value.trim(),
        role: document.getElementById('man-att-role').value,
        phone: document.getElementById('man-att-phone').value.trim(),
        email: '',
        timestamp,
        createdAt: Date.now()
      };

      if (isFirebaseReady && db) {
        try {
          await ensureFirebaseAuthSession();
          await db.collection('events').doc(ev.id).collection('attendees').doc(newId).set(record);
        } catch (err) {
          alert('Gagal menyimpan peserta ke Cloud:\n' + formatCloudErrorMessage(err));
          return;
        }
      } else {
        ev.attendees = [record, ...(ev.attendees || [])];
        saveLocalCache();
        populateAttendeesTable(ev);
        renderKPIs();
      }
      e.target.reset();
      closeAddAttendeeModal();

    async function removeAttendee(attId) {
      const ev = eventsData.find(item => item.id === selectedEventId);
      if (!ev || !confirm('Hapus data peserta ini dari daftar hadir?')) return;

      if (isFirebaseReady && db) {
        try {
          await ensureFirebaseAuthSession();
          await db.collection('events').doc(ev.id).collection('attendees').doc(attId).delete();
        } catch (err) {
          alert('Gagal menghapus peserta di Cloud:\n' + formatCloudErrorMessage(err));

      } else {
        ev.attendees = (ev.attendees || []).filter(a => a.id !== attId);
        saveLocalCache();
        populateAttendeesTable(ev);
        renderKPIs();
      }
    }

    function exportAttendeesCSV() {
      const ev = eventsData.find(item => item.id === selectedEventId);
      if (!ev) return;
      const rows = [['No', 'Nama Lengkap', 'Sekolah/Instansi', 'Kabupaten/Kota', 'Peran', 'WhatsApp', 'Email', 'Waktu Hadir']];
      (ev.attendees || []).forEach((a, i) => {

      const csvContent = 'data:text/csv;charset=utf-8,' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');

    function populateLmsAdminPanel(ev) {
      const badge = document.getElementById('lms-admin-badge');
      const isEligible = isLmsEligibleCategory(ev.category);
      if (badge) {
        badge.textContent = isEligible
          ? `Aktif di Portal (${ev.category})`
          : `Nonaktif di Portal (Kategori: ${ev.category})`;
        badge.className = isEligible
          ? 'px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800'
          : 'px-3 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800';
      }

      const modList = document.getElementById('adm-lms-modules-list');
      const modules = ev.lmsModules || [];
      if (modList) {
        modList.innerHTML = modules.length > 0
          ? modules.map((m, idx) => `
            <div class="p-3.5 rounded-2xl border border-indigo-100 bg-indigo-50/30 flex items-center justify-between gap-3">
              <div class="min-w-0">
                <span class="text-[10px] font-extrabold uppercase text-indigo-700">${escapeHtml(m.sessionLabel || `Sesi ${idx + 1}`)}</span>
                <div class="font-bold text-xs text-navy-900 truncate">${escapeHtml(m.title)}</div>
                <div class="text-[11px] text-slate-500 truncate">${escapeHtml(m.taskPrompt || 'Tanpa tugas tambahan')}</div>
              </div>
              <button type="button" onclick="removeLmsModule('${escapeHtml(m.id)}')" class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white text-xs font-bold shrink-0">Hapus</button>
            </div>
          `).join('')
          : '<p class="text-xs text-slate-400">Belum ada modul LMS pada kegiatan ini.</p>';
      }

      const tbody = document.getElementById('adm-lms-progress-tbody');
      const attendees = ev.attendees || [];
      if (!tbody) return;

      if (attendees.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">Belum ada peserta terdaftar.</td></tr>`;
        return;
      }

      tbody.innerHTML = attendees.map(a => {
        const prog = a.lmsProgress || {};
        const doneCount = modules.filter(m => prog[m.id] && prog[m.id].completed).length;
        const pct = modules.length > 0 ? Math.round((doneCount / modules.length) * 100) : 0;

        const taskLinks = modules
          .filter(m => prog[m.id] && prog[m.id].taskUrl)
          .map((m, idx) => `<a href="${escapeHtml(sanitizeUrl(prog[m.id].taskUrl))}" target="_blank" rel="noopener noreferrer" class="inline-block px-2 py-0.5 rounded bg-blue-100 text-blue-800 font-bold mr-1 hover:underline">Tugas ${idx + 1}</a>`)
          .join('');

        return `
          <tr class="hover:bg-indigo-50/20">
            <td class="py-2.5 px-3 font-bold text-navy-900">${escapeHtml(a.name)}</td>
            <td class="py-2.5 px-3 text-slate-600">${escapeHtml(a.school)}</td>
            <td class="py-2.5 px-3">
              <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${pct === 100 && modules.length > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-700'}">
                ${doneCount}/${modules.length} Sesi (${pct}%)
              </span>
            </td>
            <td class="py-2.5 px-3">${taskLinks || '<span class="text-slate-400">-</span>'}</td>
            <td class="py-2.5 px-3">
              <div class="flex items-center gap-1.5">
                <input type="text" value="${escapeHtml(a.lmsScore || '')}" onchange="updateAttendeeLmsScore('${escapeHtml(a.id)}', this.value)" placeholder="Contoh: 92 / Lulus" class="w-28 px-2.5 py-1 rounded-lg border border-slate-200 text-xs" />
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function handleCertTemplateUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 1280;
          canvas.height = 905;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 1280, 905);
          uploadedTemplateDataUrl = canvas.toDataURL('image/jpeg', 0.80);
          document.getElementById('cert-template-url').value = '';
          updateLiveCertPreview();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function generatePreviewQrDataUrl(text) {
      if (window.QRCode) {
        try {
          const tempDiv = document.createElement('div');
          new window.QRCode(tempDiv, {
            text: text,
            width: 160,
            height: 160,
            colorDark: '#000000',
            colorLight: '#FFFFFF',
            correctLevel: window.QRCode.CorrectLevel ? window.QRCode.CorrectLevel.L : 1
          });
          const canvas = tempDiv.querySelector('canvas');
          if (canvas) return canvas.toDataURL('image/png');
        } catch (e) {}
      }
      return `https://api.qrserver.com/v1/create-qr-code/?size=160x160&ecc=L&margin=6&data=${encodeURIComponent(text)}`;
    }

      try {
        const hasSession = sessionStorage.getItem(ADMIN_SESSION_KEY) === '1';
        const rawUser = sessionStorage.getItem(SESSION_KEY_CURRENT_USER) || localStorage.getItem(SESSION_KEY_CURRENT_USER);
        if (hasSession && rawUser) {
          const parsedUser = JSON.parse(rawUser);
          if (parsedUser && (parsedUser.role === 'superadmin' || parsedUser.role === 'admin' || parsedUser.role === 'panitia')) {
            grantAdminSession(parsedUser);
          }
        }
      } catch (e) {}
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
